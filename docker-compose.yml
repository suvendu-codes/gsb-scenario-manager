services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-scene}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scene}
      POSTGRES_DB: ${DB_NAME:-scene}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-scene}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


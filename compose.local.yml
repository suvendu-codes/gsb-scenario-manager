name: scenario-worker-local

x-worker-image: &worker-image
  image: ${LOCAL_WORKER_IMAGE:-scenario-worker-local:dev}
  build:
    context: .
    dockerfile: apps/api/core-service/Dockerfile.local

x-worker-env: &worker-env
  NODE_ENV: development
  LOCAL_DEMO_ENABLED: "true"
  DATABASE_URL: postgresql://scene:scene@postgres:5432/scene_local
  STATUS_WORKER_ENABLED: "true"
  KAFKA_BROKERS: kafka:9092
  KAFKA_GROUP_ID: scenario-worker-local
  KAFKA_STATUS_TOPIC: run.response.local
  KAFKA_RESULT_TOPIC: run.response.local
  KAFKA_SSL: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scene
      POSTGRES_PASSWORD: scene
      POSTGRES_DB: scene_local
    ports:
      - "127.0.0.1:${LOCAL_PG_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scene -d scene_local"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka-volume-init:
    image: apache/kafka:4.1.2
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:1000 /data"]
    volumes:
      - kafka_data:/data
    restart: "no"

  kafka:
    image: apache/kafka:4.1.2
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${LOCAL_KAFKA_PORT:-19092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${LOCAL_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  init:
    <<: *worker-image
    environment: *worker-env
    command: ["node", "dist-tools/tools/local/init-main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *worker-image
    environment: *worker-env
    init: true
    stop_grace_period: 45s
    depends_on:
      init:
        condition: service_completed_successfully

  generator:
    <<: *worker-image
    environment:
      <<: *worker-env
      DEMO_EVENT_DELAY_MS: "500"
    profiles: ["demo"]
    command: ["node", "dist-tools/tools/local/generate-main.js"]
    depends_on:
      worker:
        condition: service_started
    restart: "no"

volumes:
  postgres_data:
  kafka_data:
